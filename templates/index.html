<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Home | AI Resume Screening</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
            font-family:Arial,Helvetica,sans-serif;
        }

        .navbar{
            background:#0d6efd;
        }

        .navbar-brand,
        .nav-link{
            color:white !important;
        }

        .upload-card{
            margin-top:50px;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,.15);
            padding:30px;
            background:white;
        }

        textarea{
            resize:none;
        }

        footer{
            margin-top:60px;
            text-align:center;
            color:gray;
        }
    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand" href="#">
            AI Resume Screening
        </a>

        <ul class="navbar-nav ms-auto">

            <li class="nav-item">

                <a class="nav-link"
                   href="{{ url_for('student_dashboard') }}">

                    Dashboard

                </a>

            </li>

            <li class="nav-item">

                <a class="nav-link"
                   href="{{ url_for('logout') }}">

                    Logout

                </a>

            </li>

        </ul>

    </div>

</nav>

<div class="container">

    <div class="upload-card">

        <h2 class="text-center text-primary">
            Welcome {{ name }}
        </h2>

        <hr>

        <form
            action="{{ url_for('upload') }}"
            method="POST"
            enctype="multipart/form-data">

            <div class="mb-3">

                <label class="form-label">

                    Upload Resume (PDF)

                </label>

                <input
                    type="file"
                    class="form-control"
                    name="resume"
                    accept=".pdf"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Job Description

                </label>

                <textarea
                    class="form-control"
                    rows="8"
                    name="job_description"
                    placeholder="Paste Job Description Here..."
                    required></textarea>

            </div>

            <button
                class="btn btn-primary w-100">

                Analyze Resume

            </button>

        </form>

    </div>

</div>

<footer>

    <p>
        © 2026 AI Resume Screening System
    </p>

</footer>

</body>
</html>
