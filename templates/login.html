<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI Resume Screening</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:linear-gradient(135deg,#4e73df,#1cc88a);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial,Helvetica,sans-serif;
        }

        .login-card{
            width:420px;
            background:white;
            border-radius:15px;
            padding:35px;
            box-shadow:0 10px 30px rgba(0,0,0,.25);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            font-weight:bold;
            color:#4e73df;
        }

        .btn-primary{
            width:100%;
            border-radius:30px;
        }

        a{
            text-decoration:none;
        }

        .logo{
            font-size:45px;
            text-align:center;
            margin-bottom:10px;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">
        📄
    </div>

    <h2>AI Resume Screening</h2>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}

            <div class="alert alert-warning">
                {{ message }}
            </div>

            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('login') }}" method="POST">

        <div class="mb-3">

            <label>Email</label>

            <input
                type="email"
                class="form-control"
                name="email"
                placeholder="Enter Email"
                required>

        </div>

        <div class="mb-3">

            <label>Password</label>

            <input
                type="password"
                class="form-control"
                name="password"
                placeholder="Enter Password"
                required>

        </div>

        <button class="btn btn-primary">
            Login
        </button>

    </form>

    <hr>

    <p class="text-center">

        Don't have an account?

        <a href="{{ url_for('register') }}">

            Register Here

        </a>

    </p>

</div>

</body>
</html>
