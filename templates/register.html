<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | AI Resume Screening</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:linear-gradient(135deg,#36b9cc,#4e73df);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial,Helvetica,sans-serif;
        }

        .register-card{
            width:450px;
            background:#fff;
            border-radius:15px;
            padding:35px;
            box-shadow:0 10px 30px rgba(0,0,0,.25);
        }

        h2{
            text-align:center;
            color:#4e73df;
            font-weight:bold;
            margin-bottom:25px;
        }

        .btn-success{
            width:100%;
            border-radius:30px;
        }

        a{
            text-decoration:none;
        }

        .logo{
            font-size:45px;
            text-align:center;
            margin-bottom:10px;
        }
    </style>

</head>

<body>

<div class="register-card">

    <div class="logo">📝</div>

    <h2>Create Account</h2>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}

            <div class="alert alert-warning">
                {{ message }}
            </div>

            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('register') }}" method="POST">

        <div class="mb-3">
            <label>Full Name</label>
            <input type="text"
                   name="name"
                   class="form-control"
                   placeholder="Enter Full Name"
                   required>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email"
                   name="email"
                   class="form-control"
                   placeholder="Enter Email"
                   required>
        </div>

        <div class="mb-3">
            <label>Phone Number</label>
            <input type="text"
                   name="phone"
                   class="form-control"
                   placeholder="Enter Phone Number"
                   required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Create Password"
                   required>
        </div>

        <button class="btn btn-success">
            Register
        </button>

    </form>

    <hr>

    <p class="text-center">

        Already have an account?

        <a href="{{ url_for('login') }}">
            Login Here
        </a>

    </p>

</div>

</body>
</html>
