<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f5f7fa;
            font-family:Arial,Helvetica,sans-serif;
        }

        .navbar{
            background:#0d6efd;
        }

        .navbar-brand,
        .nav-link{
            color:white !important;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 4px 15px rgba(0,0,0,.15);
        }

        h2{
            color:#0d6efd;
            font-weight:bold;
        }

        table{
            margin-top:20px;
        }

        th{
            background:#0d6efd !important;
            color:white;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand">
            AI Resume Screening
        </a>

        <ul class="navbar-nav ms-auto">

            <li class="nav-item">

                <a href="{{ url_for('home') }}"
                   class="nav-link">

                    Home

                </a>

            </li>

            <li class="nav-item">

                <a href="{{ url_for('logout') }}"
                   class="nav-link">

                    Logout

                </a>

            </li>

        </ul>

    </div>

</nav>

<div class="container mt-5">

    <div class="card p-4">

        <h2>
            Welcome {{ name }}
        </h2>

        <hr>

        {% if resumes %}

        <table class="table table-bordered table-hover">

            <thead>

            <tr>

                <th>ID</th>
                <th>Skills</th>
                <th>Match Score</th>
                <th>ATS Score</th>
                <th>Recommendations</th>

            </tr>

            </thead>

            <tbody>

            {% for resume in resumes %}

            <tr>

                <td>{{ resume[0] }}</td>

                <td>{{ resume[2] }}</td>

                <td>{{ resume[3] }}%</td>

                <td>{{ resume[4] }}%</td>

                <td>{{ resume[5] }}</td>

            </tr>

            {% endfor %}

            </tbody>

        </table>

        {% else %}

        <div class="alert alert-info">

            No resumes uploaded yet.

        </div>

        {% endif %}

    </div>

</div>

</body>

</html>
